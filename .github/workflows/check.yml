name: Build and check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with GitHub Pages dependencies
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --trace
      - name: Check internal links and anchors
        run: python3 scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
          retention-days: 7
