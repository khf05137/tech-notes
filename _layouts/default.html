<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="技術ノート ホーム"><span class="brand-symbol" aria-hidden="true">tn<span>.</span></span><span>{{ site.title }}</span></a>
      <nav aria-label="メインナビゲーション">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>記事一覧</a>
        <a href="{{ '/categories/' | relative_url }}"{% if page.url == '/categories/' %} aria-current="page"{% endif %}>カテゴリ</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>このサイトについて</a>
      </nav>
    </div>
  </header>
  <main id="main" class="site-main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer"><div class="footer-inner"><span class="footer-name">{{ site.title }}<small>Windows / .NET / Development</small></span><span>© {{ site.time | date: '%Y' }} {{ site.author }}<br><a href="https://github.com/khf05137/tech-notes">GitHub</a> · Built with Jekyll &amp; GitHub Pages</span></div></footer>
</body>
</html>
